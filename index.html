<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>국문 고전소설 현대어역 DB 색인</title>
<style>
:root{--blue:#01449E;--navy:#0A2A5E;--light:#B8D6F4;--tint:#EEF4FB;--orange:#FCAF17;--text:#1F2A33;--muted:#5F6B75;--line:#D6E0EC;--bg:#F6F8FB;--card:#FFFFFF;
--cP:#01449E;--cR:#B87800;--cL:#1E7B4F;--cO:#6B3FA0;--cA:#C2410C;--cT:#8A2A55;--cH:#7A8590}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"NanumSquare_ac","NanumSquareOTF_ac","Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:14px}
header{background:var(--navy);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.3px}
.badge{background:var(--orange);color:var(--navy);font-weight:800;font-size:11px;padding:3px 8px;border-radius:3px}
header .stats{margin-left:auto;display:flex;gap:20px;font-size:11.5px;color:var(--light);flex-wrap:wrap}
header .stats b{display:block;color:#fff;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,.85fr);height:calc(100vh - 58px)}
aside{background:var(--card);border-right:1px solid var(--line);padding:14px;overflow:auto}
aside h3{font-size:11px;color:var(--muted);margin:16px 0 8px;font-weight:800;letter-spacing:.5px}
aside h3:first-child{margin-top:0}
.box{max-height:230px;overflow:auto;border:1px solid #EEF2F6;border-radius:4px;padding:2px}
.chk{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:4px;font-size:12.5px}
.chk small{margin-left:auto;color:var(--muted);font-size:11px}
.chk.off{color:#A5AEB7}
.cat{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:13px;margin-bottom:2px}
.cat:hover{background:var(--tint)}
.cat.on{background:var(--tint);color:var(--blue);font-weight:800}
.cat i{width:10px;height:10px;border-radius:2px;display:inline-block}
.cat small{margin-left:auto;color:var(--muted);font-weight:400;font-size:11px}
.note{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:14px;padding:10px;background:var(--tint);border-radius:4px}
main{overflow:auto;padding:16px 18px;border-right:1px solid var(--line)}
.search{display:flex;gap:8px;margin-bottom:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--text)}
.search input:focus{outline:2px solid var(--light);border-color:var(--blue)}
.search button{font:inherit;font-weight:800;background:var(--blue);color:#fff;border:0;border-radius:4px;padding:0 16px;cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin:2px 0 12px;line-height:1.6}
.hint b{color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:12px}
.k{font-size:11.5px;color:var(--muted);font-weight:800;margin-bottom:8px}
.sum{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
.sum b{font-size:26px;color:var(--navy);font-weight:800;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.sum small{font-size:11.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--tint);border:1px solid transparent;border-radius:12px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.chip b{color:var(--blue);margin-left:4px}
.chip small{color:var(--muted)}
.chip.on{border-color:var(--blue);background:var(--card)}
.chip.R{background:#FFF4DA}
.dist{display:flex;align-items:flex-end;gap:2px;height:46px;margin-top:6px}
.dist div{flex:1;background:var(--light);min-height:1px;border-radius:2px 2px 0 0}
.distl{display:flex;gap:2px;font-size:9.5px;color:var(--muted)}
.distl span{flex:1;text-align:center}
.wname{font-size:12px;font-weight:800;color:var(--navy);margin:10px 0 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:var(--muted);text-align:left;font-weight:800;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid #EEF2F6;vertical-align:top}
td.n{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.tag{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--tint);white-space:nowrap}
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;font-size:13px}
.idx div{display:flex;justify-content:space-between;gap:8px;padding:4px 6px;border-radius:3px;cursor:pointer}
.idx div:hover{background:var(--tint)}
.idx small{color:var(--muted)}
section.detail{overflow:auto;background:var(--card);padding:18px 22px}
.empty{color:var(--muted);font-size:13.5px;line-height:1.8}
.pname{font-size:22px;font-weight:800;color:var(--navy)}
.pname span{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.pnote{color:var(--text);margin:6px 0 14px;line-height:1.6}
.nums{display:flex;gap:22px;margin-bottom:14px}
.nums b{font-size:22px;color:var(--blue);font-weight:800;display:block;font-variant-numeric:tabular-nums}
.nums small{font-size:11.5px;color:var(--muted)}
@media (max-width: 900px){
  html,body{height:auto}
  .wrap{display:block;height:auto}
  aside,main{border-right:0;border-bottom:1px solid var(--line)}
  header,main,aside,section.detail{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  header .stats{margin-left:0}
}
</style>
</head>
<body>
<header>
  <h1>국문 고전소설 현대어역 DB</h1><span class="badge">공개 색인판</span>
  <div class="stats" id="stats"></div>
</header>
<div class="wrap">
  <aside>
    <h3>현대어역본</h3>

  <main>

    <div class="hint" id="hint"></div>
    <div id="res"></div>

  <section class="detail" id="detail"><div class="empty">검색 결과에서 인물이나 항목을 누르면 여기에 정보가 나옵니다.<br>인물은 이름과 별칭, 설명, 그 인물을 가리킨 호칭들, 회·권별 등장 분포를 보여 줍니다.</div></section>
</div>

function detail(w, id, t){
  const d = document.getElementById('detail');
  if (t==='L'||t==='O') { const p = w.places[id] || {name:id,note:''}; const n = w.occ.filter(o=>o[4].split(' ').includes(id)).length; d.innerHTML = `<div class="pname">${esc(p.name)}<span>${esc(w.title)} · ${TN[t]}</span></div><div class="pnote">${esc(p.note||'')}</div><div class="nums"><div><b>${nf(n)}</b><small>등장</small></div></div>`; return; }
  const p = w.persons[id]; if (!p) return;
  const occ = w.occ.filter(o => (o[2]==='P'||o[2]==='R') && o[4].split(' ').includes(id));
  const forms = {}; occ.forEach(o => { const k = o[3]+'|'+o[2]; forms[k]=(forms[k]||0)+1; });
  const nR = occ.filter(o=>o[2]==='R').length;
  const ch = w.uList.map(u => occ.filter(o=>o[0]===u).length), mx = Math.max(1,...ch);
  d.innerHTML = `<div class="pname">${esc(p.name)}<span>${p.sex==='M'?'남':p.sex==='F'?'여':''} · ${esc(w.title)}</span></div>
    <div class="pnote">${esc(p.note||'')}${p.alias&&p.alias.length?`<br><span style="color:var(--muted);font-size:12.5px">별칭: ${p.alias.map(esc).join(', ')}</span>`:''}</div>
    <div class="nums"><div><b>${nf(occ.length)}</b><small>지칭</small></div><div><b>${nf(nR)}</b><small>호칭·관직·대명사</small></div><div><b>${Object.keys(forms).length}</b><small>지칭 형태</small></div></div>
    <div class="k">지칭 형태 <span style="font-weight:400">파랑: 이름 · 노랑: 호칭·관직·대명사</span></div>
    <div class="chips">${Object.entries(forms).sort((a,b)=>b[1]-a[1]).slice(0,30).map(([k,n])=>{ const [s,ty]=k.split('|'); return `<span class="chip ${ty}">${esc(s)}<b>${n}</b></span>`; }).join('')}</div>
    <div class="k" style="margin-top:16px">${w.unit}별 등장</div><div class="dist">${ch.map((n,i)=>`<div title="${w.uList[i]}${w.unit} ${n}건" style="height:${Math.round(n/mx*100)}%"></div>`).join('')}</div><div class="distl">${w.uList.map(u=>`<span>${u}</span>`).join('')}</div>`;
}
const go = () => { st.q = document.getElementById('q').value.trim(); st.ref = null; run(); };
document.getElementById('go').onclick = go;
document.getElementById('q').onkeydown = e => { if (e.key === 'Enter') go(); };
stats(); side(); run();
</script>
</body>
</html>
